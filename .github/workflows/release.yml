name: Test and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v0.2.0 (used by manual runs)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Full test suite
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Go formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -gt 0) {
            $unformatted | ForEach-Object { Write-Host "::error file=$_::gofmt required" }
            throw 'Go files are not formatted (run gofmt -w .)'
          }

      - name: Go vet and tests
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend syntax checks
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path 'frontend/dist/js' -Filter '*.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'Frontend syntax check failed' }

      - name: Frontend unit tests
        shell: pwsh
        run: |
          node --test frontend/tests/store.test.mjs frontend/tests/envbulk.test.mjs frontend/tests/download.test.mjs frontend/tests/headers.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    name: Build Windows packages and publish
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref_name == github.event.repository.default_branch
      ))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $wailsVersion = (go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2).Trim()
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wailsVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gopath = (go env GOPATH).Trim()
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path -LiteralPath (Join-Path $nsis 'makensis.exe'))) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path -LiteralPath (Join-Path $nsis 'makensis.exe'))) {
            throw 'NSIS makensis was not installed'
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          $wix = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $wix 'candle.exe'))) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
          }
          if (-not (Test-Path -LiteralPath (Join-Path $wix 'candle.exe'))) {
            $candle = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $candle) { throw 'WiX Toolset v3 candle.exe was not found' }
            $wix = $candle.Directory.FullName
          }
          $wix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = "${{ inputs.version }}".Trim()
          } else {
            $project = Get-Content -LiteralPath 'wails.json' -Raw | ConvertFrom-Json
            $tag = 'v' + [string]$project.info.productVersion
          }
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Release version must look like v1.2.3 (got '$tag')"
          }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build portable exe, NSIS installer and MSI
        shell: pwsh
        run: |
          & ./scripts/build-windows.ps1 -Version "${{ steps.release.outputs.version }}"

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $assets = @(
            "build/bin/NanoAPI-$env:VERSION-x64.exe",
            "build/bin/NanoAPI-$env:VERSION-x64-installer.exe",
            "build/bin/NanoAPI-$env:VERSION-x64.msi"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }

          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            gh release create $env:TAG @assets --title "NanoAPI $env:TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $env:TAG @assets --target $env:GITHUB_SHA --title "NanoAPI $env:TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
